[project]
name = "website"
version = "0"
description = "Static site generator for lostella.github.io"
requires-python = ">=3.11"
dependencies = [
    "mistune>=3.3.4,<4",
    "latex2mathml>=3.81.0,<4",
]

[project.scripts]
build = "website:build"
serve = "website:serve"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    # ruff and ty are pre-1.0, so breaking changes land in the segment below.
    "ruff>=0.16.3,<0.17",
    "ty>=0.0.71,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# The suite lives in a single test.py, which pytest's defaults do not collect.
python_files = ["test.py", "test_*.py"]

[tool.ruff.lint]
# Pinned explicitly so local runs and CI agree regardless of ruff's defaults.
select = ["E", "F", "I", "UP", "B", "SIM"]
